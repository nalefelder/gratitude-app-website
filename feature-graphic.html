<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024">
  <title>Feature Graphic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .graphic {
      width: 1024px;
      height: 500px;
      background: linear-gradient(135deg, #4A42D4 0%, #6C63FF 40%, #A5A0FF 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      padding: 0 80px;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
    }

    /* Decorative circles */
    .graphic::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -80px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
    }

    .graphic::after {
      content: '';
      position: absolute;
      bottom: -120px;
      left: -60px;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
    }

    .left {
      flex-shrink: 0;
      z-index: 1;
    }

    .logo {
      width: 180px;
      height: 180px;
      border-radius: 40px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.25);
    }

    .right {
      z-index: 1;
    }

    .right h1 {
      font-size: 42px;
      font-weight: 800;
      color: #fff;
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .right p {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.5;
      max-width: 480px;
    }

    .tags {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <div class="graphic">
    <div class="left">
      <img src="logo.png" alt="Logo" class="logo">
    </div>
    <div class="right">
      <h1>Gratitude<br>Performance<br>Tracker</h1>
      <p>Build better habits, track your goals, and grow every day.</p>
      <div class="tags">
        <span class="tag">Gratitude Journal</span>
        <span class="tag">Habit Tracker</span>
        <span class="tag">Nutrition</span>
        <span class="tag">Fitness</span>
        <span class="tag">Wellness</span>
      </div>
    </div>
  </div>
</body>
</html>
